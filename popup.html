<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Website Reader & Summarizer</title>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        width: 320px;
        padding: 12px;
        background: linear-gradient(135deg, #181818, #2c2c2c);
        color: #f1f1f1;
      }
      h2 {
        text-align: center;
        font-size: 18px;
        margin-bottom: 10px;
      }
      textarea {
        width: 100%;
        height: 140px;
        background: #101010;
        color: white;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 8px;
        resize: none;
      }
      button {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }
      #summarizeBtn {
        background: #007bff;
        color: white;
      }
      #readBtn {
        background: #28a745;
        color: white;
      }
    </style>
  </head>
  <body>
    <h2>Website Reader 🔮</h2>
    <textarea id="output" readonly placeholder="Extracted text will appear here..."></textarea>
    <button id="summarizeBtn">Summarize ✨</button>
    <button id="readBtn">Read Aloud 🔊</button>
    <script src="popup.js"></script>
  </body>
</html>
